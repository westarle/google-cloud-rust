[package]
name = "google-cloud-observability-macros"
version = "0.1.0"
edition = "2021"
description = "Internal procedural macros for Google Cloud Rust observability"
license = "Apache-2.0"
repository = "https://github.com/googleapis/google-cloud-rust"
rust-version = "1.75"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
